<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6a1046" />
    <meta name="description" content="Vòng quay màu hồng của lớp 8A1." />
    <title>Vòng quay màu hồng · Lớp 8A1</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="particle-layer" class="particle-layer" aria-hidden="true"></div>
    <main class="app-shell">
      <header class="hero">
        <div>
          <h1>Vòng quay <span>màu hồng</span></h1>
          <p id="class-name">Lớp 8A1</p>
        </div>
        <nav class="header-actions" aria-label="Công cụ">
          <a class="btn btn-secondary" href="./edit/">Danh sách</a>
          <button id="settings-btn" class="btn btn-secondary" type="button" aria-controls="settings-panel" aria-expanded="false">Cài đặt</button>
        </nav>
      </header>
      <section class="wheels" aria-label="Vòng quay ghép cặp">
        <article class="wheel-card card" id="male-wheel-card">
          <div class="wheel-heading"><h2>Bạn nam</h2><p class="pool-status" id="male-pool-status"></p></div>
          <div class="wheel-frame">
            <div class="pointer" aria-hidden="true"></div>
            <canvas id="male-wheel" width="440" height="440" role="img" aria-label="Vòng quay bạn nam. Tên được chọn hiển thị bên dưới."></canvas>
          </div>
          <p class="picked-name" id="male-name">—</p>
        </article>
        <article class="wheel-card card" id="female-wheel-card">
          <div class="wheel-heading"><h2>Bạn nữ</h2><p class="pool-status" id="female-pool-status"></p></div>
          <div class="wheel-frame">
            <div class="pointer" aria-hidden="true"></div>
            <canvas id="female-wheel" width="440" height="440" role="img" aria-label="Vòng quay bạn nữ. Tên được chọn hiển thị bên dưới."></canvas>
          </div>
          <p class="picked-name" id="female-name">—</p>
        </article>
      </section>
      <section class="controls" aria-label="Điều khiển vòng quay">
        <button id="spin-btn" class="btn btn-primary" type="button" disabled>Quay</button>
        <button id="reset-btn" class="btn btn-secondary" type="button" disabled>Bắt đầu lại</button>
        <p id="spin-status" class="control-hint" role="status">Đang tải danh sách lớp…</p>
      </section>
      <section class="result card" aria-labelledby="result-title">
        <div class="result-heading"><h2 id="result-title">Kết quả</h2><p id="pair-count"></p></div>
        <p id="pair-result" aria-live="polite">Đang tải danh sách lớp…</p>
        <div id="history-section" class="history-section" hidden>
          <h3>Các cặp gần đây</h3>
          <ol id="pair-meta" class="pair-meta"></ol>
        </div>
        <p id="refill-status" class="refill-status" role="status"></p>
        <button id="new-round-btn" class="btn btn-primary" type="button" hidden>Bắt đầu lượt mới</button>
      </section>
    </main>
    <dialog id="settings-panel" class="settings-panel" aria-labelledby="settings-panel-title">
      <div class="settings-header">
        <h2 id="settings-panel-title">Cài đặt</h2>
        <button id="settings-close-btn" class="btn btn-secondary" type="button" autofocus>Đóng</button>
      </div>
      <section class="setting-group" aria-label="Giao diện">
        <h3>Giao diện</h3>
        <label for="theme-color">Màu vòng quay</label>
        <input id="theme-color" type="color" value="#ff5eaf" />
        <button id="theme-reset-btn" class="btn btn-secondary" type="button">Màu mặc định</button>
      </section>
      <section class="setting-group" aria-label="Thời gian quay">
        <h3>Quay</h3>
        <label for="spin-duration-range">Thời gian cho mỗi lần quay</label>
        <input id="spin-duration-range" type="range" min="1800" max="6000" step="100" value="3600" />
        <p class="setting-value" id="spin-duration-value">3,6 giây</p>
      </section>
      <section class="setting-group" aria-label="Quay lại">
        <h3>Quay lại</h3>
        <label class="setting-checkbox" for="allow-respin-input">
          <input id="allow-respin-input" type="checkbox" checked />
          Cho phép quay lại 1 lần khi hiện kết quả
        </label>
      </section>
      <section class="setting-group" aria-label="Lịch sử">
        <h3>Lịch sử</h3>
        <label for="history-count-input">Số cặp gần đây hiển thị</label>
        <input id="history-count-input" type="number" min="1" max="8" step="1" value="3" />
      </section>
    </dialog>
    <dialog id="result-popup" class="result-popup" aria-labelledby="result-popup-title" aria-describedby="result-popup-hint">
      <h2 id="result-popup-title">Kết quả</h2>
      <p id="result-popup-pair" class="result-popup-pair"></p>
      <div class="result-popup-actions">
        <button id="result-keep-btn" class="btn btn-primary" type="button" autofocus>Giữ cặp này</button>
        <button id="result-respin-btn" class="btn btn-secondary" type="button">Quay lại bạn nữ</button>
      </div>
      <p id="result-popup-hint" class="result-popup-hint"></p>
    </dialog>
    <script type="module" src="./app.js"></script>
  </body>
</html>
